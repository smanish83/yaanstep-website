name: Record stories

# Records the library stories with Kokoro-82M (Apache-2.0), voice af_heart (Manish, 24 Nov 2026: "Yes, start with stories").
# Push to an audio/** branch; .github/scripts/audio-batch.json says which age band and how many shards.
# The recordings are committed back to the same branch under stories/audio/, then reviewed and merged by hand.
on:
  push:
    branches: ['audio/**']
    paths: ['.github/scripts/audio-batch.json', '.github/scripts/record_stories.py', '.github/workflows/record-stories.yml']

permissions:
  contents: read

concurrency:
  group: record-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      count: ${{ steps.p.outputs.count }}
      ages: ${{ steps.p.outputs.ages }}
      limit: ${{ steps.p.outputs.limit }}
      force: ${{ steps.p.outputs.force }}
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: p
        run: |
          f=.github/scripts/audio-batch.json
          echo "shards=$(jq -c '[range(0; .shards)]' $f)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r .shards $f)" >> "$GITHUB_OUTPUT"
          echo "ages=$(jq -r .ages $f)" >> "$GITHUB_OUTPUT"
          echo "limit=$(jq -r '.limit // 0' $f)" >> "$GITHUB_OUTPUT"
          echo "force=$(jq -r 'if .force then "--force" else "" end' $f)" >> "$GITHUB_OUTPUT"
          echo "ids=$(jq -r '(.ids // []) | join(",")' $f)" >> "$GITHUB_OUTPUT"
  record:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/
            stories/catalog.json
            stories/books/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Record
        run: python .github/scripts/record_stories.py . out --ages "${{ needs.plan.outputs.ages }}" --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.count }} --limit ${{ needs.plan.outputs.limit }} ${{ needs.plan.outputs.force }} --ids "${{ needs.plan.outputs.ids }}"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.shard }}
          path: out/
          retention-days: 7
  commit:
    needs: [plan, record]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-*
          path: got
          merge-multiple: true
      - name: Commit the recordings to this branch
        run: |
          mkdir -p reports && mv got/report-*.json reports/ 2>/dev/null || true
          cat reports/*.json || true
          git sparse-checkout disable
          mkdir -p stories/audio
          for d in got/*/; do rm -rf "stories/audio/$(basename "$d")"; done
          cp -r got/* stories/audio/
          git add -A stories/audio
          # Commits go under Manish's name, with either of his two addresses (his choice, 23 Nov 2026).
          if [ $((RANDOM % 2)) = 0 ]; then e=13033301+smanish83@users.noreply.github.com; else e=smanish83@gmail.com; fi
          git -c user.name="Manish Sandbhor" -c user.email="$e" commit -q -m "Recorded stories: ages ${{ needs.plan.outputs.ages }} (Kokoro, af_heart)" || echo nothing new
          git push origin HEAD:${{ github.ref_name }}
